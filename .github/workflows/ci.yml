name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  shared:
    name: shared crypto core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  indexer:
    name: off-chain indexer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  web:
    name: web client (build + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace deps (links shared + indexer)
        run: npm install
      - name: Type-check + build
        working-directory: web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        working-directory: web
        run: npm run e2e

  contracts-compile:
    name: contracts (solc compile check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run compile

  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install deps
        run: |
          forge install foundry-rs/forge-std --no-git || true
          forge install OpenZeppelin/openzeppelin-contracts --no-git || true
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test (unit + fuzz + invariant)
        run: forge test -vvv
      - name: Coverage
        run: forge coverage --report summary

  slither:
    name: static analysis (slither)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0
        with:
          target: contracts/
